# ==============================================================================
# IRIS — Production Docker Compose (Coolify & Single-Domain Deployment)
# ==============================================================================
# Architecture:
# - Single Public Entrypoint: https://iris.example.com (Frontend on port 80)
# - Nginx proxies /api/* and /health internally to backend:8000
# - Persistent SQLite storage mounted at /app/data
# ==============================================================================

services:
  # --- 1. Backend: FastAPI + SQLite + Alembic + AIProvider ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: iris-backend:latest
    container_name: iris_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Asia/Kolkata}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/iris.db}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      # AI model (any provider/model; see .env.example)
      - AI_PROVIDER=${AI_PROVIDER:-nvidia}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-}
      - AI_AGENT_MAX_STEPS=${AI_AGENT_MAX_STEPS:-8}
      - AI_AGENT_MAX_STEPS_HARD=${AI_AGENT_MAX_STEPS_HARD:-24}
      - AI_CAPABILITIES=${AI_CAPABILITIES:-}
      - AI_EXTRA_BODY=${AI_EXTRA_BODY:-}
      - AI_EXTRA_HEADERS=${AI_EXTRA_HEADERS:-}
      # Legacy vendor settings (used when AI_* are unset)
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      - NVIDIA_TIMEOUT_SECONDS=${NVIDIA_TIMEOUT_SECONDS:-45.0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-45.0}
    volumes:
      - iris_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- 2. Frontend: React Vite SPA + Nginx Reverse Proxy ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: iris-frontend:latest
    container_name: iris_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  iris_data:
    name: iris_data
    driver: local
