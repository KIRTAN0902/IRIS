name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Vercel / Live Deployment URL (e.g. https://irisai.runs-on.dev/)'
        required: false
        default: 'https://irisai.runs-on.dev/'
  push:
    branches:
      - main
    paths:
      - 'frontend/android/**'
      - 'frontend/src/**'
      - 'frontend/capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Accept Android SDK Licenses & Install Required SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Assets & Sync Capacitor
        working-directory: frontend
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.VERCEL_URL || 'https://irisai.runs-on.dev/' }}
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-mobile-app
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Output Job Summary
        run: |
          echo "### 📱 IRIS Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been compiled and is ready for download." >> $GITHUB_STEP_SUMMARY
          echo "- **Target URL**: \`${{ inputs.server_url || vars.VERCEL_URL || 'https://irisai.runs-on.dev/' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: [iris-mobile-app](#artifacts)" >> $GITHUB_STEP_SUMMARY
